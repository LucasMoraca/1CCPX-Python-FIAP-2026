<p> Exercício 3 - Maior valor
Encontre o maior valor do vetor sem usar funções prontas.</p>

<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        let dados = [10, 20, 30, 40, 50];
        let maior = dados[0];

        for (let i = 0; i < dados.length; i++) {
            if (dados[i] > maior) {
                maior = dados[i];
            }
        }
        console.log('Valor maior = ', maior);
    </script>
</head>
