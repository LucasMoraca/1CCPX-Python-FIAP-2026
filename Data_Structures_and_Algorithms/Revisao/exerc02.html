<p>Exercício 2 - Soma dos elementos
Some todos os valores de um vetor numérico.</p>
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        let dados = [10, 20, 30, 40, 50];
        let soma = 0;

        for (let i = 0; i < dados.length; i++) {
            soma = soma + dados[i];
        }
        console.log('Soma = ', soma);
    </script>
</head>
